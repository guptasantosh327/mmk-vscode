name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck and test (mongo-migrate-kit ${{ matrix.mmk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The pinned devDependency, and the oldest version the extension supports
        # (MIN_MMK_VERSION in src/mmk/compat.ts; a contract test keeps the two equal).
        mmk: [pinned, 1.5.0]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Use mongo-migrate-kit ${{ matrix.mmk }}
        if: matrix.mmk != 'pinned'
        run: npm install --no-save mongo-migrate-kit@${{ matrix.mmk }}

      - name: Lint (biome)
        run: npx biome ci src test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Cache MongoDB binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Contract tests (real mmk + mongodb-memory-server)
        run: npm run test:contract

      - name: Integration tests (VS Code)
        run: xvfb-run -a npm run test:integration
